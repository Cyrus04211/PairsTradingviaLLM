universe:
  min_market_cap_usd: 5_000_000_000
  local_grouped_industry_dir: "data/sec_companies_gt_5B_marketcap_by_industry_plate_grouped"
  sec_tickers_url: "https://www.sec.gov/files/company_tickers.json"

industry:
  futu_host: "127.0.0.1"
  futu_port: 11111
  rate_limit_sleep: 5.0

embedding:
  api_key_env: "CLOSEAI_API_KEY"
  api_url: "https://api.openai-proxy.org/v1/embeddings"
  model: "text-embedding-3-large"
  batch_size: 128
  summary_model: "gpt-5.4"
  summary_api_url: "https://api.openai-proxy.org/v1/chat/completions"
  summary_workers: 4
  summary_max_retries: 4
  summary_request_timeout: 300
  double_tower_root: ""
  reuse_text_artifact_roots: []
  submissions_zip: "cache/submissions_v2.zip"
  edgar_data_dir: "cache/edgar_data"
  edgar_cache_dir: "cache/edgar_http_cache"
  sec_user_agent: "Your Name your_email@example.com"
  filing_year: 0

text_similarity:
  weights:
    core_business: 0.30
    main_product_service: 0.30
    customer_channel: 0.25
    geography: 0.15
  keep_fraction: 0.30

return_correlation:
  neutralization_window: 120
  price_history_days: 1200
  window_candidates: [252, 504, 1000]
  end_date: "2026-05-08"
  keep_fraction: 0.50

candidate_selection:
  company_appearance_cap: 2

llm_review:
  api_key_env: "CLOSEAI_API_KEY"
  api_url: "https://api.openai-proxy.org/v1/chat/completions"
  model: "gpt-5.4"
  workers: 10
  reasoning_effort: "high"
  max_retries: 3
  request_timeout: 300

weight_optimization:
  lookback_days: 60
  lambda_industry: 1.0
  lambda_volatility: 1.0
  lambda_size: 1.0
  x_min: 0.2
  x_max: 0.8
